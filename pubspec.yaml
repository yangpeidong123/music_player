name: music_player
description: "一款支持导入洛雪音源的跨平台音乐播放器 - 界面美观、性能强劲、内存占用小"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # 状态管理
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  
  # 路由
  go_router: ^14.2.0
  
  # 网络请求
  dio: ^5.5.0
  
  # 本地存储
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  
  # 音频播放
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  media_kit: ^1.2.6
  
  # 图片缓存
  cached_network_image: ^3.4.0
  
  # JS 沙箱 (QuickJS)
  flutter_js: ^0.8.7
  
  # 加密工具
  crypto: ^3.0.5
  encrypt: ^5.0.3
  pointycastle: ^3.8.0
  
  # 压缩
  archive: ^3.6.1
  
  # 工具
  intl: ^0.20.3
  permission_handler: ^11.3.1
  package_info_plus: ^8.0.0
  device_info_plus: ^11.0.0
  connectivity_plus: ^6.0.5
  url_launcher: ^6.2.6
  share_plus: ^10.0.0
  
  # UI
  material_design_icons_flutter: ^7.0.7296
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  
  # 代码生成
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.11
  drift_dev: ^2.18.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/polyfills/
  
  # fonts:
  #   - family: NotoSansSC
  #     fonts:
  #       - asset: assets/fonts/NotoSansSC-Regular.otf
