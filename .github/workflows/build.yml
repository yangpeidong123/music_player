name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 策略：把当前代码（lib/ assets/ pubspec.yaml）复制到一个新建的 Flutter 项目中
      # 避免 flutter create . 检测不到 Flutter 项目的复杂问题
      - name: Create temp Flutter project
        run: |
          cd $HOME
          flutter create --platforms=android --org com.example --project-name music_player music_player_temp
          cd music_player_temp
          # 用我们的代码替换 lib/ assets/ pubspec.yaml
          rm -rf lib
          cp -r $GITHUB_WORKSPACE/lib .
          cp -r $GITHUB_WORKSPACE/assets .
          # 合并 pubspec.yaml (用我们的)
          cp $GITHUB_WORKSPACE/pubspec.yaml pubspec.yaml
          # 合并 analysis_options.yaml
          cp $GITHUB_WORKSPACE/analysis_options.yaml . 2>/dev/null || true
          # 合并 .gitignore
          cp $GITHUB_WORKSPACE/.gitignore . 2>/dev/null || true
          flutter pub get
          # 现在开始 build
          flutter build apk --release --split-per-abi
          flutter build apk --release
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Copy APKs to workspace
        run: |
          mkdir -p $GITHUB_WORKSPACE/build_artifacts
          cp $HOME/music_player_temp/build/app/outputs/flutter-apk/*.apk $GITHUB_WORKSPACE/build_artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build_artifacts/*.apk
          retention-days: 30

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create temp Flutter project
        shell: bash
        run: |
          cd $HOME
          flutter create --platforms=windows --org com.example --project-name music_player music_player_temp
          cd music_player_temp
          rm -rf lib
          cp -r "$GITHUB_WORKSPACE/lib" .
          cp -r "$GITHUB_WORKSPACE/assets" .
          cp "$GITHUB_WORKSPACE/pubspec.yaml" pubspec.yaml
          cp "$GITHUB_WORKSPACE/analysis_options.yaml" . 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/.gitignore" . 2>/dev/null || true
          flutter pub get
          flutter build windows --release
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Archive
        shell: bash
        run: |
          cd $HOME/music_player_temp/build/windows/x64/runner/Release
          7z a "$GITHUB_WORKSPACE/windows-release.zip" *

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: windows-release.zip
          retention-days: 30

  release:
    name: Create Release
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Android
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts/android

      - name: Download Windows
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: artifacts/windows

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/android/*.apk
            artifacts/windows/*.zip
