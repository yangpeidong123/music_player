name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Create temp Flutter project
        shell: bash
        run: |
          cd $HOME
          flutter create -t app --platforms=android --org com.example --project-name music_player --no-pub music_player_temp
          cd music_player_temp
          rm -rf lib
          cp -r "$GITHUB_WORKSPACE/lib" .
          cp -r "$GITHUB_WORKSPACE/assets" .
          cp "$GITHUB_WORKSPACE/pubspec.yaml" pubspec.yaml
          # 不要覆盖 .gitignore 和 analysis_options.yaml
          echo "org.gradle.jvmargs=-Xmx2048M" >> android/gradle.properties
          echo "kotlin.jvm.target.validation.mode=warning" >> android/gradle.properties
          flutter pub get
          flutter build apk --release --split-per-abi
          flutter build apk --release
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Copy APKs to workspace
        run: |
          mkdir -p $GITHUB_WORKSPACE/build_artifacts
          cp $HOME/music_player_temp/build/app/outputs/flutter-apk/*.apk $GITHUB_WORKSPACE/build_artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build_artifacts/*.apk
          retention-days: 30

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Create temp Flutter project
        shell: bash
        run: |
          cd $HOME
          flutter create --platforms=windows --org com.example --project-name music_player music_player_temp
          cd music_player_temp
          rm -rf lib
          cp -r "$GITHUB_WORKSPACE/lib" .
          cp -r "$GITHUB_WORKSPACE/assets" .
          cp "$GITHUB_WORKSPACE/pubspec.yaml" pubspec.yaml
          cp "$GITHUB_WORKSPACE/analysis_options.yaml" . 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/.gitignore" . 2>/dev/null || true
          flutter pub get
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Patch CMakeLists to suppress coroutine deprecation
        shell: pwsh
        run: |
          Get-ChildItem -Path "$env:USERPROFILE\music_player_temp\windows" -Recurse -Filter "*.vcxproj" | ForEach-Object {
            $content = Get-Content $_.FullName -Raw
            if ($content -notmatch "_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS") {
              $newContent = $content -replace '<PreprocessorDefinitions>([^<]*)</PreprocessorDefinitions>', '<PreprocessorDefinitions>$1;_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS</PreprocessorDefinitions>'
              if ($newContent -ne $content) {
                Set-Content -Path $_.FullName -Value $newContent
                Write-Host "Patched: $($_.FullName)"
              }
            }
          }

      - name: Build Windows
        shell: bash
        run: |
          cd "$HOME/music_player_temp"
          flutter build windows --release

      - name: Archive
        shell: bash
        run: |
          # 用 tar 创建 zip 文件 (Windows 自带 tar 支持 zip 格式)
          # 在 $HOME 目录下创建, 避免 GITHUB_WORKSPACE 中的 D:\ 路径问题
          cd "$HOME/music_player_temp/build/windows/x64/runner/Release"
          ZIP_PATH="$HOME/windows-release.zip"
          tar -a -c -f "$ZIP_PATH" *
          echo "Created zip at: $ZIP_PATH"
          ls -la "$ZIP_PATH"
          # 用 cp 复制到 GITHUB_WORKSPACE (cp 在 Git Bash 中能正确处理 Windows 路径)
          mkdir -p "$GITHUB_WORKSPACE"
          cp "$ZIP_PATH" "$GITHUB_WORKSPACE/windows-release.zip" 2>/dev/null || cp "$ZIP_PATH" "/d/a/music_player/music_player/windows-release.zip"
          ls -la "$GITHUB_WORKSPACE/windows-release.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: windows-release.zip
          retention-days: 30

  release:
    name: Create Release
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Android
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts/android

      - name: Download Windows
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: artifacts/windows

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/android/*.apk
            artifacts/windows/*.zip
