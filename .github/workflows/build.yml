name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Create temp Flutter project
        run: |
          cd $HOME
          flutter create --platforms=android --org com.example --project-name music_player music_player_temp
          cd music_player_temp
          rm -rf lib
          cp -r $GITHUB_WORKSPACE/lib .
          cp -r $GITHUB_WORKSPACE/assets .
          cp $GITHUB_WORKSPACE/pubspec.yaml pubspec.yaml
          cp $GITHUB_WORKSPACE/analysis_options.yaml . 2>/dev/null || true
          cp $GITHUB_WORKSPACE/.gitignore . 2>/dev/null || true
          flutter pub get
          flutter build apk --release --split-per-abi
          flutter build apk --release
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Copy APKs to workspace
        run: |
          mkdir -p $GITHUB_WORKSPACE/build_artifacts
          cp $HOME/music_player_temp/build/app/outputs/flutter-apk/*.apk $GITHUB_WORKSPACE/build_artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build_artifacts/*.apk
          retention-days: 30

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create temp Flutter project
        shell: bash
        run: |
          cd $HOME
          flutter create --platforms=windows --org com.example --project-name music_player music_player_temp
          cd music_player_temp
          rm -rf lib
          cp -r "$GITHUB_WORKSPACE/lib" .
          cp -r "$GITHUB_WORKSPACE/assets" .
          cp "$GITHUB_WORKSPACE/pubspec.yaml" pubspec.yaml
          cp "$GITHUB_WORKSPACE/analysis_options.yaml" . 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/.gitignore" . 2>/dev/null || true
          flutter pub get
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Patch CMakeLists to suppress coroutine deprecation
        shell: pwsh
        run: |
          # 在所有 vcxproj 中添加 /D _SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
          # 修复 Windows MSVC STL1011 错误 (permission_handler / connectivity_plus 等插件触发)
          Write-Host "Patching project files to silence coroutine deprecation warnings..."
          Get-ChildItem -Path "$HOME/music_player_temp\windows" -Recurse -Filter "*.vcxproj" | ForEach-Object {
            $content = Get-Content $_.FullName -Raw
            if ($content -notmatch "_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS") {
              # Add to ClCompile PreprocessorDefinitions
              $newContent = $content -replace '<PreprocessorDefinitions>([^<]*)</PreprocessorDefinitions>', '<PreprocessorDefinitions>$1;_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS</PreprocessorDefinitions>'
              if ($newContent -ne $content) {
                Set-Content -Path $_.FullName -Value $newContent
                Write-Host "Patched: $($_.FullName)"
              }
            }
          }

      - name: Build Windows
        shell: bash
        run: |
          cd $HOME/music_player_temp
          flutter build windows --release

      - name: Archive
        shell: pwsh
        run: |
          # $HOME 在 pwsh 中已设置, 复用它
          $source = Join-Path $env:HOME "music_player_temp\build\windows\x64\runner\Release\*"
          $dest = Join-Path $env:GITHUB_WORKSPACE "windows-release.zip"
          Write-Host "Source: $source"
          Write-Host "Dest: $dest"
          Write-Host "HOME: $env:HOME"
          if (Test-Path $dest) { Remove-Item $dest -Force }
          Compress-Archive -Path $source -DestinationPath $dest -Force
          Write-Host "Created: $dest"
          Get-ChildItem $dest

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: windows-release.zip
          retention-days: 30

  release:
    name: Create Release
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Android
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts/android

      - name: Download Windows
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: artifacts/windows

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/android/*.apk
            artifacts/windows/*.zip
